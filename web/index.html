<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Proxy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="rail">
    <div class="mark">
      <span class="mark-dot" aria-hidden="true"></span>
      <div>
        <div class="mark-name">Claude Proxy</div>
        <div class="mark-meta">local meter</div>
      </div>
    </div>
    <nav class="navs" aria-label="Primary">
      <button class="nav active" data-page="usage">Usage</button>
      <button class="nav" data-page="requests">Requests</button>
      <button class="nav" data-page="routing">Routing</button>
      <button class="nav" data-page="access">Access</button>
    </nav>
    <div class="rail-foot">
      <span id="status-pill" class="chip">loading</span>
    </div>
  </aside>
  <main class="stage">
    <header class="mast">
      <div>
        <p class="kicker" id="page-kicker">Usage</p>
        <h1 id="page-title">How full is the week</h1>
        <p id="page-subtitle">Plan limits and equivalent API spend</p>
      </div>
      <button id="refresh-btn" class="ghost" type="button">Refresh</button>
    </header>
    <section id="app" class="sheet" aria-live="polite"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
